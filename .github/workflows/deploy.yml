name: Mettre à jour les matchs et publier

on:
  push:
    branches: [main]
  schedule:
    # Deux fois par jour (heure UTC) : nouveaux résultats et matchs de la semaine.
    - cron: "17 6,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Matchs, buteurs, compos et presse (OneFootball)
        run: python scripts/fetch_onefootball.py
        continue-on-error: true
      - name: Cotes du marché (football-data.co.uk)
        run: python scripts/fetch_data.py
        continue-on-error: true
      - name: Recalculer les pronostics
        run: python scripts/build_data.py --real
      - name: Enregistrer les nouvelles données dans le dépôt
        run: |
          git config user.name "lucide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if ! git diff --cached --quiet; then
            git add public/data/season.json
            git commit -m "Données Ligue 1 mises à jour"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
