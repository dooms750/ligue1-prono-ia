name: Mettre à jour les matchs et publier

on:
  push:
    branches: [main]
  schedule:
    # Collecte complète deux fois par jour (heure UTC) : résultats, calendrier, presse, météo, cotes.
    - cron: "17 6,17 * * *"
    # Pendant les créneaux de match (heure UTC), toutes les 20 minutes : seulement les matchs en cours
    # ou terminés depuis peu, pour que les résultats entrent vite dans le débrief et le bilan.
    - cron: "7,27,47 18-22 * * 1-5"
    - cron: "7,27,47 13-22 * * 6"
    - cron: "7,27,47 11-22 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mode de collecte
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 6,17 * * *" ]; then
            echo "quick=true" >> "$GITHUB_OUTPUT"
          else
            echo "quick=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Matchs en cours ou terminés depuis peu (OneFootball, mode rapide)
        if: steps.mode.outputs.quick == 'true'
        run: python scripts/fetch_onefootball.py --quick
        continue-on-error: true
      - name: Matchs, buteurs, compos et presse (OneFootball)
        if: steps.mode.outputs.quick != 'true'
        run: python scripts/fetch_onefootball.py
        continue-on-error: true
      - name: Scores à la pause des matchs récents (ESPN)
        run: python scripts/fetch_espn.py
        continue-on-error: true
      - name: Météo des matchs, de J-7 à J-2 (ECMWF et Météo-France via Open-Meteo)
        if: steps.mode.outputs.quick != 'true'
        run: python scripts/fetch_weather.py
        continue-on-error: true
      - name: Cotes du marché et scores à la pause (football-data.co.uk)
        if: steps.mode.outputs.quick != 'true'
        run: python scripts/fetch_data.py
        continue-on-error: true
      - name: Historique des saisons passées, pour mesurer le modèle (ESPN, archives météo)
        if: steps.mode.outputs.quick != 'true'
        run: python scripts/fetch_history.py
        continue-on-error: true
      - name: Recalculer les pronostics
        run: python scripts/build_data.py --real
      - name: Enregistrer les nouvelles données dans le dépôt
        run: |
          git config user.name "lucide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if ! git diff --cached --quiet; then
            git add public/data/season.json
            git commit -m "Données Ligue 1 mises à jour"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
